name: Build OpenWrt Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64
          - aarch64_generic
          - arm_cortex-a7_neon-vfpv4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup build env
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison \
          git subversion python3 python3-pip unzip libssl-dev

      - name: Clone OpenWrt source
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git pull

      - name: Add package feeds
        run: |
          cd openwrt
          echo "src-git luci https://github.com/openwrt/luci.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy luci-app-adguardhome
        run: |
          cp -r $GITHUB_WORKSPACE openwrt/package/luci-app-adguardhome

      - name: Generate .config
        run: |
          cd openwrt
          make defconfig
          echo "CONFIG_PACKAGE_luci-app-adguardhome=y" >> .config
          make menuconfig -n

      - name: Compile package
        run: |
          cd openwrt
          make package/luci-app-adguardhome/compile -j$(nproc)

      - name: Upload ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.target }}
          path: openwrt/bin/packages/*/luci-app-adguardhome*.ipk
