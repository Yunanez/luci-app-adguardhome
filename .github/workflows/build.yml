name: Build luci-app-adguardhome IPK
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev wget tar

      - name: Download & Extract OpenWrt 23.05.3 SDK x86_64 (Tuna mirror)
        run: |
          wget --tries=10 https://mirrors.tuna.tsinghua.edu.cn/openwrt/releases/23.05.3/targets/x86/64/openwrt-sdk-23.05.3-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar -xf openwrt-sdk*.tar.xz
          ls -la
          SDK_DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*")
          mv "$SDK_DIR" openwrt-sdk

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Copy plugin into SDK package
        run: |
          cp -r src/luci-app-adguardhome openwrt-sdk/package/
          ls openwrt-sdk/package/luci-app-adguardhome/

      - name: Compile & Install (generate IPK)
        run: |
          cd openwrt-sdk
          export TERM=dumb
          ./scripts/feeds update -a
          ./scripts/feeds install luci-compat
          make defconfig
          make package/luci-app-adguardhome/clean
          make package/luci-app-adguardhome/compile
          make package/luci-app-adguardhome/install V=s

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-adguardhome-ipk
          path: openwrt-sdk/bin/packages/x86_64/luci/*.ipk
