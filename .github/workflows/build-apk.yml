name: 编译 iStoreOS 25.12 APK 插件

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PLUGIN_NAME: luci-app-adguardhome
  IStoreOS_BRANCH: istoreos-25.12
  ARCHIVE_ARCH: x86_64

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出当前插件源码
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: 查看插件目录结构（排查用）
        run: |
          echo "=== plugin 目录结构 ==="
          ls -la plugin/
          echo "=== 查找 Makefile ==="
          find plugin -name Makefile

      - name: 安装全套编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses-dev \
          libssl-dev libtool python3 python3-setuptools python3-pyelftools \
          rsync subversion swig unzip wget xsltproc zlib1g-dev flex bison \
          autoconf automake pkg-config gperf

      - name: 拉取 iStoreOS 25.12 源码
        run: |
          git clone https://github.com/istoreos/istoreos.git -b $IStoreOS_BRANCH openwrt

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 复制插件到自定义目录（稳妥版）
        run: |
          # 先创建目标插件目录
          mkdir -p openwrt/package/custom/$PLUGIN_NAME
          # 把plugin目录下的所有文件完整复制到目标目录
          cp -rf plugin/* openwrt/package/custom/$PLUGIN_NAME/
          # 复制隐藏文件（如果有）
          cp -rf plugin/.* openwrt/package/custom/$PLUGIN_NAME/ 2>/dev/null || true
          # 验证Makefile是否存在
          ls -la openwrt/package/custom/$PLUGIN_NAME/Makefile

      - name: 生成配置并启用插件
        run: |
          cd openwrt
          unset TARGET_ARCH ARCH CFLAGS CXXFLAGS LDFLAGS
          
          cat > .config << EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          EOF
          
          make defconfig V=s
          echo "CONFIG_PACKAGE_$PLUGIN_NAME=m" >> .config
          make defconfig V=s

      - name: 编译插件（单线程详细日志）
        run: |
          cd openwrt
          unset TARGET_ARCH ARCH CFLAGS CXXFLAGS LDFLAGS
          make package/custom/$PLUGIN_NAME/clean -j1 V=sc
          make package/custom/$PLUGIN_NAME/compile -j1 V=sc

      - name: 收集 APK 产物
        run: |
          mkdir -p output
          find openwrt/bin/packages -name "${PLUGIN_NAME}*.apk" -exec cp {} output/ \;

      - name: 上传编译结果
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}_${{ env.ARCHIVE_ARCH }}_APK
          path: output/
