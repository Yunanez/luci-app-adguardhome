name: 打包 iStoreOS AdGuardHome 插件

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PLUGIN_NAME: luci-app-adguardhome
  PLUGIN_VERSION: 1.0.0
  TARGET_ARCH: x86_64
  ARCHIVE_ARCH: x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4
        with:
          path: repo

      - name: 创建标准打包目录
        run: |
          rm -rf pkg
          mkdir -p pkg/control
          mkdir -p pkg/data/usr/lib/lua/luci
          mkdir -p pkg/data/usr/lib/lua/luci/i18n

      - name: 复制插件文件（适配嵌套目录）
        run: |
          SRC_DIR="repo/luci-app-adguardhome"
          
          # 1. 完整复制 LuCI 程序目录，自动保留所有子目录层级
          if [ -d "$SRC_DIR/luasrc" ]; then
            cp -rf "$SRC_DIR/luasrc"/* pkg/data/usr/lib/lua/luci/
          fi
          
          # 2. 复制 root 目录文件（直接映射到系统根路径）
          if [ -d "$SRC_DIR/root" ]; then
            cp -rf "$SRC_DIR/root"/* pkg/data/
          fi
          
          # 3. 复制中文语言文件
          if [ -f "$SRC_DIR/po/zh-cn/adguardhome.po" ]; then
            cp -f "$SRC_DIR/po/zh-cn/adguardhome.po" pkg/data/usr/lib/lua/luci/i18n/adguardhome.zh-cn.po
          fi

      - name: 统一修复文件权限
        run: |
          # Lua 脚本设为 644 权限
          find pkg/data -name "*.lua" -exec chmod 644 {} \;
          # 启动脚本、Shell 工具设为 755 执行权限
          find pkg/data/etc/init.d -type f -exec chmod 755 {} \;
          find pkg/data/usr/share/AdGuardHome -type f -name "*.sh" -exec chmod 755 {} \;
          # 统一目录权限
          find pkg/data -type d -exec chmod 755 {} \;

      - name: 生成标准 control 控制文件
        run: |
          printf "Package: luci-app-adguardhome\nVersion: 1.0.0\nArchitecture: x86_64\nMaintainer: Custom Build\nSection: luci\nPriority: optional\nDepends: luci-base\nDescription: LuCI App AdGuard Home\n AdGuard Home 管理界面，支持核心更新、日志查看、DNS 重定向。\n .\n\n" > pkg/control/control

      - name: 生成 md5 校验文件
        run: |
          cd pkg/data
          find . -type f | sort | xargs md5sum > ../control/md5sums
          cd ../../

      - name: 标准格式打包 APK
        run: |
          cd pkg
          printf "2.0\n" > debian-binary
          cd control && tar --format=ustar -czf ../control.tar.gz . && cd ..
          cd data && tar --format=ustar -czf ../data.tar.gz . && cd ..
          tar --format=ustar -cf ../${PLUGIN_NAME}_${ARCHIVE_ARCH}.apk debian-binary control.tar.gz data.tar.gz
          cd ..
          
          ls -lh ${PLUGIN_NAME}_${ARCHIVE_ARCH}.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}_${{ env.ARCHIVE_ARCH }}_APK
          path: ${{ env.PLUGIN_NAME }}_${{ env.ARCHIVE_ARCH }}.apk
