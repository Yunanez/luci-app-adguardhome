name: 编译 iStoreOS 25.12 APK 插件

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PLUGIN_NAME: luci-app-adguardhome
  IStoreOS_BRANCH: istoreos-25.12
  ARCHIVE_ARCH: x86_64

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出当前插件源码
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: 安装全套编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses-dev \
          libssl-dev libtool python3 python3-setuptools python3-pyelftools \
          rsync subversion swig unzip wget xsltproc zlib1g-dev flex bison \
          autoconf automake pkg-config gperf

      - name: 拉取 iStoreOS 25.12 源码
        run: |
          git clone https://github.com/istoreos/istoreos.git -b $IStoreOS_BRANCH openwrt

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 复制插件到自定义目录（修复路径错误）
        run: |
          mkdir -p openwrt/package/custom
          # 核心修复：直接将plugin目录整体复制并重命名为插件名
          cp -r plugin openwrt/package/custom/$PLUGIN_NAME

      - name: 生成配置并启用插件
        run: |
          cd openwrt
          unset TARGET_ARCH ARCH CFLAGS CXXFLAGS LDFLAGS
          
          # 写入x86_64通用设备基础架构配置
          cat > .config << EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          EOF
          
          # 第一次：生成完整基础配置
          make defconfig V=s
          
          # 追加插件启用配置
          echo "CONFIG_PACKAGE_$PLUGIN_NAME=m" >> .config
          
          # 第二次：校验配置并自动补全所有依赖项
          make defconfig V=s

      - name: 编译插件（单线程详细日志，方便排查）
        run: |
          cd openwrt
          unset TARGET_ARCH ARCH CFLAGS CXXFLAGS LDFLAGS
          # 先验证插件Makefile是否存在
          ls -la package/custom/$PLUGIN_NAME/Makefile
          # 单线程编译输出最详细日志，出错直接定位
          make package/custom/$PLUGIN_NAME/clean -j1 V=sc
          make package/custom/$PLUGIN_NAME/compile -j1 V=sc

      - name: 收集 APK 产物
        run: |
          mkdir -p output
          find openwrt/bin/packages -name "${PLUGIN_NAME}*.apk" -exec cp {} output/ \;

      - name: 上传编译结果
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}_${{ env.ARCHIVE_ARCH }}_APK
          path: output/
