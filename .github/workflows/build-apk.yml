name: 打包 iStoreOS 25.12 APK 插件

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PLUGIN_NAME: luci-app-adguardhome
  PLUGIN_VERSION: 1.0.0
  TARGET_ARCH: x86_64
  ARCHIVE_ARCH: x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出插件源码
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: 查看源码结构（排查用）
        run: |
          echo "=== 插件源码目录结构 ==="
          find plugin -type f | head -60

      - name: 创建标准目录结构
        run: |
          rm -rf pkg
          mkdir -p pkg/control
          mkdir -p pkg/data/usr/lib/lua/luci/controller
          mkdir -p pkg/data/usr/lib/lua/luci/model/cbi
          mkdir -p pkg/data/usr/lib/lua/luci/view
          mkdir -p pkg/data/www/luci-static/resources/view
          mkdir -p pkg/data/etc/config
          mkdir -p pkg/data/etc/init.d

      - name: 复制插件文件到标准路径
        run: |
          # 复制控制器 Lua 文件
          find plugin -type f -name "*.lua" -path "*controller*" -exec cp -v {} pkg/data/usr/lib/lua/luci/controller/ \;
          
          # 复制 CBI 模型文件
          find plugin -type f -name "*.lua" -path "*cbi*" -exec cp -v {} pkg/data/usr/lib/lua/luci/model/cbi/ \;
          
          # 复制视图文件
          find plugin -type f \( -name "*.htm" -o -name "*.html" \) -exec cp -v {} pkg/data/usr/lib/lua/luci/view/ \;
          
          # 复制静态资源
          if [ -d "plugin/htdocs" ]; then
            cp -rv plugin/htdocs/* pkg/data/www/
          fi
          
          # 复制配置文件
          find plugin -type f -path "*root/etc/config/*" -exec cp -v {} pkg/data/etc/config/ \;
          
          # 复制启动脚本
          find plugin -type f -path "*root/etc/init.d/*" -exec cp -v {} pkg/data/etc/init.d/ \;

      - name: 统一修复文件权限
        run: |
          # 给所有 Lua 脚本和可执行文件加权限
          find pkg/data -type f -name "*.lua" -exec chmod 755 {} \;
          find pkg/data/etc/init.d -type f -exec chmod 755 {} \;
          # 统一目录权限
          find pkg/data -type d -exec chmod 755 {} \;
          
          echo "=== 最终数据目录结构 ==="
          find pkg/data -type f

      - name: 生成标准 control 控制文件
        run: |
          cat > pkg/control/control << 'CONTROL_EOF'
Package: luci-app-adguardhome
Version: 1.0.0
Architecture: x86_64
Maintainer: Custom Build
Section: luci
Priority: optional
Depends: luci-base
Description: LuCI App AdGuard Home
 Web management interface for AdGuard Home service.
 .

CONTROL_EOF

          # 验证控制文件
          echo "=== control 文件内容 ==="
          cat pkg/control/control

      - name: 生成 md5 校验文件
        run: |
          cd pkg/data
          find . -type f | sort | xargs md5sum > ../control/md5sums
          cd ../..
          echo "=== md5sums ==="
          cat pkg/control/md5sums

      - name: 标准格式打包 APK
        run: |
          cd pkg
          
          # 1. 生成版本标识文件（必须第一行是 2.0）
          echo "2.0" > debian-binary
          
          # 2. 打包控制文件（gzip 压缩）
          tar -czf control.tar.gz -C control .
          
          # 3. 打包数据文件（gzip 压缩）
          tar -czf data.tar.gz -C data .
          
          # 4. 按标准顺序组装成最终 APK 包（tar 格式，非 ar）
          tar -cf ../${PLUGIN_NAME}_${ARCHIVE_ARCH}.apk debian-binary control.tar.gz data.tar.gz
          cd ..
          
          # 验证包
          echo "=== 生成的 APK 包 ==="
          ls -lh ${PLUGIN_NAME}_${ARCHIVE_ARCH}.apk
          echo "=== APK 包内部文件列表 ==="
          tar -tf ${PLUGIN_NAME}_${ARCHIVE_ARCH}.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}_${{ env.ARCHIVE_ARCH }}_APK
          path: ${{ env.PLUGIN_NAME }}_${{ env.ARCHIVE_ARCH }}.apk
