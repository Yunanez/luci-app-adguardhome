name: 编译 iStoreOS 25.12 APK 插件

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PLUGIN_NAME: luci-app-adguardhome
  IStoreOS_BRANCH: istoreos-25.12
  TARGET_ARCH: x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前插件源码
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: 安装完整编译依赖（补全flex/bison）
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses-dev \
          libssl-dev libtool python3 python3-setuptools rsync subversion \
          swig unzip wget xsltproc zlib1g-dev flex bison autoconf automake pkg-config

      - name: 拉取 iStoreOS 25.12 源码
        run: |
          git clone https://github.com/istoreos/istoreos.git -b $IStoreOS_BRANCH openwrt

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 复制插件到自定义目录（避免官方包冲突）
        run: |
          mkdir -p openwrt/package/custom
          cp -r plugin/$PLUGIN_NAME openwrt/package/custom/

      - name: 生成配置并启用插件
        run: |
          cd openwrt
          # 1. 生成默认基础配置（自动编译配置工具conf）
          make defconfig
          # 2. 显式指定目标架构为x86_64通用设备
          ./scripts/config --set CONFIG_TARGET_x86 y
          ./scripts/config --set CONFIG_TARGET_x86_64 y
          ./scripts/config --set CONFIG_TARGET_x86_64_DEVICE_generic y
          # 3. 启用当前插件为模块编译
          ./scripts/config --set CONFIG_PACKAGE_$PLUGIN_NAME m
          # 4. 重新生成完整配置，自动补全所有依赖项
          make defconfig

      - name: 编译插件（输出详细日志）
        run: |
          cd openwrt
          make package/custom/$PLUGIN_NAME/clean
          make package/custom/$PLUGIN_NAME/compile -j$(nproc) V=s

      - name: 收集 APK 产物
        run: |
          mkdir -p output
          find openwrt/bin/packages -name "${PLUGIN_NAME}*.apk" -exec cp {} output/ \;

      - name: 上传编译结果
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}_${{ env.TARGET_ARCH }}_APK
          path: output/
