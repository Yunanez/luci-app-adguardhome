name: 打包 iStoreOS 25.12 APK 插件

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PLUGIN_NAME: luci-app-adguardhome
  PLUGIN_VERSION: 1.0.0
  TARGET_ARCH: x86_64
  ARCHIVE_ARCH: x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出插件源码
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: 准备打包目录结构
        run: |
          mkdir -p pkg/control
          mkdir -p pkg/data/usr/lib/lua/luci
          mkdir -p pkg/data/www/luci-static/resources/view
          mkdir -p pkg/data/etc/config

      - name: 复制插件文件到对应路径
        run: |
          # 复制 Lua 程序文件
          if [ -d plugin/luasrc ]; then
            cp -rf plugin/luasrc/* pkg/data/usr/lib/lua/luci/
          fi
          
          # 复制网页静态资源
          if [ -d plugin/htdocs ]; then
            cp -rf plugin/htdocs/* pkg/data/www/
          fi
          
          # 复制配置与启动文件
          if [ -d plugin/root/etc ]; then
            cp -rf plugin/root/etc/* pkg/data/etc/
          fi

      - name: 生成控制文件 control
        run: |
          cat > pkg/control/control << EOF
          Package: $PLUGIN_NAME
          Version: $PLUGIN_VERSION
          Architecture: $TARGET_ARCH
          Maintainer: Custom Build
          Section: luci
          Priority: optional
          Depends: adguardhome, luci-base
          Description: Luci App AdGuard Home
           AdGuard Home 管理界面插件
          EOF

      - name: 打包成 APK 安装包
        run: |
          cd pkg
          
          # 打包数据文件
          tar -czf data.tar.gz -C data .
          
          # 打包控制文件
          tar -czf control.tar.gz -C control .
          
          # 写入格式版本标识
          echo -n "2.0" > debian-binary
          
          # 组装成最终 APK 包
          tar -cf ../${PLUGIN_NAME}_${ARCHIVE_ARCH}.apk debian-binary control.tar.gz data.tar.gz
          cd ..
          
          # 验证包
          ls -lh ${PLUGIN_NAME}_${ARCHIVE_ARCH}.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}_${{ env.ARCHIVE_ARCH }}_APK
          path: ${{ env.PLUGIN_NAME }}_${{ env.ARCHIVE_ARCH }}.apk
      - name: 收集 APK 产物
        run: |
          mkdir -p output
          find openwrt/bin/packages -name "${PLUGIN_NAME}*.apk" -exec cp {} output/ \;

      - name: 上传编译结果
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}_${{ env.ARCHIVE_ARCH }}_APK
          path: output/
