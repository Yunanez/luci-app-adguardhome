name: 编译 iStoreOS 25.12 APK 插件

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PLUGIN_NAME: luci-app-adguardhome
  IStoreOS_BRANCH: istoreos-25.12
  ARCHIVE_ARCH: x86_64

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出当前插件源码
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: 安装全套编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses-dev \
          libssl-dev libtool python3 python3-setuptools python3-pyelftools \
          rsync subversion swig unzip wget xsltproc zlib1g-dev flex bison \
          autoconf automake pkg-config gperf

      - name: 拉取 iStoreOS 25.12 源码
        run: |
          git clone https://github.com/istoreos/istoreos.git -b $IStoreOS_BRANCH openwrt

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 自动定位并复制插件（自适应目录结构）
        run: |
          cd openwrt
          mkdir -p package/custom
          
          # 自动查找 Makefile 所在的目录
          MAKEFILE_PATH=$(find ../plugin -name Makefile | head -n 1)
          if [ -z "$MAKEFILE_PATH" ]; then
            echo "错误：在 plugin 目录中未找到 Makefile 文件"
            echo "=== plugin 目录完整结构 ==="
            find ../plugin -type f
            exit 1
          fi
          
          # 获取 Makefile 所在的父目录（即插件源码根目录）
          PLUGIN_SRC_DIR=$(dirname "$MAKEFILE_PATH")
          echo "找到插件源码目录：$PLUGIN_SRC_DIR"
          echo "=== 插件目录内容 ==="
          ls -la "$PLUGIN_SRC_DIR"
          
          # 复制到标准目标位置
          cp -rf "$PLUGIN_SRC_DIR" package/custom/$PLUGIN_NAME
          
          # 最终验证
          echo "=== 目标目录验证 ==="
          ls -la package/custom/$PLUGIN_NAME/Makefile

      - name: 生成配置并启用插件
        run: |
          cd openwrt
          unset TARGET_ARCH ARCH CFLAGS CXXFLAGS LDFLAGS
          
          cat > .config << EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          EOF
          
          make defconfig V=s
          echo "CONFIG_PACKAGE_$PLUGIN_NAME=m" >> .config
          make defconfig V=s

      - name: 编译插件（单线程详细日志）
        run: |
          cd openwrt
          unset TARGET_ARCH ARCH CFLAGS CXXFLAGS LDFLAGS
          make package/custom/$PLUGIN_NAME/clean -j1 V=sc
          make package/custom/$PLUGIN_NAME/compile -j1 V=sc

      - name: 收集 APK 产物
        run: |
          mkdir -p output
          find openwrt/bin/packages -name "${PLUGIN_NAME}*.apk" -exec cp {} output/ \;

      - name: 上传编译结果
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}_${{ env.ARCHIVE_ARCH }}_APK
          path: output/
