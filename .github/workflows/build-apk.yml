name: 打包 iStoreOS 25.12 APK 插件

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PLUGIN_NAME: luci-app-adguardhome
  PLUGIN_VERSION: 1.0.0
  TARGET_ARCH: x86_64
  ARCHIVE_ARCH: x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出插件源码
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: 安装官方打包工具
        run: |
          sudo apt update
          sudo apt install -y ipkg-utils

      - name: 创建标准目录结构
        run: |
          rm -rf pkg
          mkdir -p pkg/control
          mkdir -p pkg/usr/lib/lua/luci/controller
          mkdir -p pkg/usr/lib/lua/luci/model/cbi
          mkdir -p pkg/usr/lib/lua/luci/view
          mkdir -p pkg/www/luci-static/resources/view
          mkdir -p pkg/etc/config
          mkdir -p pkg/etc/init.d

      - name: 复制插件文件到标准路径
        run: |
          # 复制控制器 Lua 文件
          find plugin -type f -name "*.lua" -path "*controller*" -exec cp -f {} pkg/usr/lib/lua/luci/controller/ \;
          
          # 复制 CBI 模型文件
          find plugin -type f -name "*.lua" -path "*cbi*" -exec cp -f {} pkg/usr/lib/lua/luci/model/cbi/ \;
          
          # 复制视图文件
          find plugin -type f \( -name "*.htm" -o -name "*.html" \) -exec cp -f {} pkg/usr/lib/lua/luci/view/ \;
          
          # 复制静态资源
          if [ -d "plugin/htdocs" ]; then
            cp -rf plugin/htdocs/* pkg/www/
          fi
          
          # 复制配置文件
          find plugin -type f -path "*root/etc/config/*" -exec cp -f {} pkg/etc/config/ \;
          
          # 复制启动脚本
          find plugin -type f -path "*root/etc/init.d/*" -exec cp -f {} pkg/etc/init.d/ \;

      - name: 统一修复文件权限
        run: |
          # 脚本文件赋予执行权限
          find pkg -type f -name "*.lua" -exec chmod 755 {} \;
          find pkg/etc/init.d -type f -exec chmod 755 {} \;
          # 统一目录权限
          find pkg -type d -exec chmod 755 {} \;

      - name: 生成标准 control 控制文件
        run: |
          cat > pkg/control/control << 'CONTROL_EOF'
Package: luci-app-adguardhome
Version: 1.0.0
Architecture: x86_64
Maintainer: Custom Build
Section: luci
Priority: optional
Depends: luci-base
Description: LuCI App AdGuard Home
 Web management interface for AdGuard Home service.
 .

CONTROL_EOF

      - name: 标准格式打包 APK
        run: |
          # 官方工具打包，输出标准 ipk 格式
          ipkg-build -o root -g root pkg .
          
          # 重命名为 iStoreOS 兼容的 apk 后缀
          mv luci-app-adguardhome_1.0.0_x86_64.ipk ${PLUGIN_NAME}_${ARCHIVE_ARCH}.apk
          
          # 验证包结构
          echo "=== 生成的 APK 包 ==="
          ls -lh ${PLUGIN_NAME}_${ARCHIVE_ARCH}.apk
          echo "=== 包内部文件列表 ==="
          tar -tf ${PLUGIN_NAME}_${ARCHIVE_ARCH}.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}_${{ env.ARCHIVE_ARCH }}_APK
          path: ${{ env.PLUGIN_NAME }}_${{ env.ARCHIVE_ARCH }}.apk
